<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora — Sign In</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">



<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">


<link rel="stylesheet" href="style.css">


</head>
<body class="login-page">
    

    <div class="login-wrapper">

        <div class="login-brand">
            <span class="brand-mark">N</span>
            <span class="brand-name">Nexora</span>
        </div>

        <div class="card login-card">
            <div class="card-body p-4 p-md-5">

                <h1 class="h4 mb-1">Welcome back</h1>
                <p class="text-muted mb-4">Sign in to manage your talent pipeline.</p>

                <form>
                    <div class="mb-3">
                        <label for="fullName" class="form-label">Full name</label>
                        <input type="text" class="form-control" id="fullName" placeholder="Ahmed Hassan">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="you@example.com">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-nexora w-100">Sign In</button>
                </form>

                <p class="text-center text-muted small mt-4 mb-0">
                    Don't have an account? <a href="#">Create one</a>
                </p>

            </div>
        </div>

    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<script src="script.js">
    document.querySelector("form").addEventListener("submit", function (e) {
    e.preventDefault();

    window.location.href = "home.html";
});
</script>
</body>
</html>
